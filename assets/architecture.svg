<path d="M420 288 V316 H505 V346"/><path d="M420 288 V316 H675 V346"/>
<path d="M165 404 V430 H370 V464"/><path d="M335 404 V444 H400 V464"/>
<path d="M505 404 V444 H440 V464"/><path d="M675 404 V430 H470 V464"/>
<path d="M360 554 V578 H255 V604"/><path d="M480 554 V578 H625 V604"/>
<path d="M145 632 H48 V22 H625 V42"/>
</g>
