<svg xmlns="http://www.w3.org/2000/svg" width="840" height="700" viewBox="0 0 840 700" role="img" aria-labelledby="title desc">
<title id="title">JevGPT architecture</title>
<desc id="desc">OpenAI token vocabulary and prompt plus reply feed four stratified samples of 254 tokens each. Four parallel Jev calls propose candidates. Jev verifies the four candidates or chooses DONE. An appended token returns to the conversation.</desc>
