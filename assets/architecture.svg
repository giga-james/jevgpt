<rect x="260" y="464" width="320" height="90" rx="8" fill="#fff0d9" stroke="#d3a05b"/>
<rect x="145" y="604" width="220" height="56" rx="8" fill="#fff1f6" stroke="#d88bad"/>
<rect x="515" y="604" width="220" height="56" rx="28" fill="#eaf5ef" stroke="#86ad95"/>
</g>
<g font-family="Arial, Helvetica, sans-serif" font-size="20" text-anchor="middle" fill="#29232b">
<text x="255" y="70">Token vocabulary</text><text x="255" y="96" font-size="18">OpenAI tokenizer</text><text x="255" y="120" font-size="16">cl100k_base</text>
<text x="625" y="95">Prompt + reply</text>
<text x="420" y="239">Speculative group</text><text x="420" y="267" font-size="18">4 stratified samples · 254 tokens each</text>
<text x="165" y="382">Jev 1</text><text x="335" y="382">Jev 2</text><text x="505" y="382">Jev 3</text><text x="675" y="382">Jev 4</text>
<text x="420" y="500">Jev verifier</text><text x="420" y="529">4 candidates + DONE</text>
<text x="255" y="639">Append token</text><text x="625" y="639">DONE · Finish</text>

<text x="28" y="385" transform="rotate(-90 28 385)" fill="#c9b6de" font-size="16">Repeat with updated reply</text>
</g>
