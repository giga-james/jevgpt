[project]
name = "jevgpt"
version = "0.1.0"
description = "A deliberately questionable chatbot powered by Jev classification"
requires-python = ">=3.11"
dependencies = ["httpx>=0.28,<1", "python-dotenv>=1,<2", "tiktoken>=0.11,<1"]

[project.scripts]
jevgpt = "jevgpt.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
